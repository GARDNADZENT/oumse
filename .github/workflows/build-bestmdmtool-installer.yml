name: Build BestMDMTool Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - arena/010a7cc2-oumse
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: bestmdmtool-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12 (x64) for the standalone exe
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build standalone BestMDMTool.exe (no Python needed by users)
        shell: pwsh
        run: ./installer-bestmdmtool/build_exe.ps1

      - name: Build installer
        shell: pwsh
        run: ./installer-bestmdmtool/build_installer.ps1

      - name: Self-test the frozen application
        shell: pwsh
        run: |
          $exe = "installer-bestmdmtool/frozen/BestMDMTool/BestMDMTool.exe"
          if (-not (Test-Path $exe)) { throw "Standalone BestMDMTool.exe was not built" }
          $report = Join-Path $env:TEMP "bestmdmtool-selftest.json"
          # The frozen bundle is built inside the repo, so point the app at the
          # source tree: this validates module collection, not the install path.
          $env:BESTMDMTOOL_ROOT = (Get-Location).Path
          # PowerShell does not wait for GUI-subsystem binaries, so wait explicitly.
          $proc = Start-Process -FilePath $exe -ArgumentList @("--selftest", $report) -Wait -PassThru -NoNewWindow
          if ($proc.ExitCode -ne 0) { throw "Frozen app self-test failed (exit $($proc.ExitCode))" }
          if (-not (Test-Path $report)) { throw "Self-test report was not written" }
          $json = Get-Content $report -Raw | ConvertFrom-Json
          Write-Host ($json | ConvertTo-Json -Depth 4)
          if (-not $json.ok) { throw "Self-test reported failure" }
          if (-not $json.runner_exists) { throw "service_runner.py missing from the bundle" }
          if (-not $json.python_exists) { throw "Bundled runtime Python missing" }
          foreach ($page in @("dashboard", "partitions", "flasher", "advanced", "bootloader", "adb", "settings", "about")) {
            if ($json.pages -notcontains $page) { throw "UI page missing from bundle: $page" }
          }

      - name: Self-test the frozen runner backend
        shell: pwsh
        run: |
          $exe = "installer-bestmdmtool/frozen/BestMDMToolRunner/BestMDMToolRunner.exe"
          if (-not (Test-Path $exe)) { throw "BestMDMToolRunner.exe was not built" }
          $report = Join-Path $env:TEMP "bestmdmtool-runner-selftest.json"
          $env:BESTMDMTOOL_ROOT = (Get-Location).Path
          $proc = Start-Process -FilePath $exe -ArgumentList @("--selftest", $report) -Wait -PassThru -NoNewWindow
          if (-not (Test-Path $report)) { throw "Runner self-test report was not written" }
          $json = Get-Content $report -Raw | ConvertFrom-Json
          Write-Host ($json | ConvertTo-Json -Depth 4)
          $json | ConvertTo-Json -Depth 4 | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          $detail = (Get-Content $report -Raw) -replace "`r?`n", " "
          if ($detail.Length -gt 1200) { $detail = $detail.Substring(0, 1200) }
          if ($proc.ExitCode -ne 0) {
            Write-Output "::error::Runner self-test exited $($proc.ExitCode): $detail"
            throw "Runner self-test failed (exit $($proc.ExitCode))"
          }
          if (-not $json.ok) {
            Write-Output "::error::Runner backend self-test reported failure: $detail"
            throw "Runner backend self-test reported failure"
          }
          if (-not $json.mtkclient) { throw "mtkclient missing from the runner bundle" }
          if (-not $json.libusb_backend) {
            Write-Output "::error::libusb backend could not be loaded: $detail"
            throw "libusb backend could not be loaded (missing DLL)"
          }
          if (-not $json.da_v5) { throw "MTK_DA_V5.bin not reachable from the runner" }

      - name: Prove the installed layout finds its own runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          try {
            # The step above runs from the build tree with BESTMDMTOOL_ROOT set.
            # This reproduces the real install layout - {app}\runtime\runner and
            # {app}\runtime\lib - with no environment help at all.
            $app = Join-Path $env:TEMP "bestmdmtool-install"
            if (Test-Path $app) { Remove-Item -Recurse -Force $app }
            $runner = Join-Path $app "runtime\runner"
            $loader = Join-Path $app "runtime\lib\mtkclient\Loader"
            New-Item -ItemType Directory -Force -Path $runner, $loader | Out-Null
            Copy-Item -Path "installer-bestmdmtool/frozen/BestMDMToolRunner/*" -Destination $runner -Recurse -Force
            Copy-Item -Path "runtime/lib/mtkclient/Loader/MTK_DA_V*.bin" -Destination $loader -Force

            Remove-Item Env:BESTMDMTOOL_ROOT -ErrorAction SilentlyContinue
            Remove-Item Env:OUMSE_ROOT -ErrorAction SilentlyContinue
            Remove-Item Env:SVC_ROOT -ErrorAction SilentlyContinue
            Remove-Item Env:SVC_RUNNER_EXE -ErrorAction SilentlyContinue

            $exe = Join-Path $app "runtime\runner\BestMDMToolRunner.exe"
            if (-not (Test-Path $exe)) { throw "Runner copy failed: $exe" }
            Write-Host "Installed-layout runner: $exe"
            Get-ChildItem $runner | Select-Object -First 12 Name | Format-Table | Out-String | Write-Host

            $report = Join-Path $env:TEMP "bestmdmtool-installed-selftest.json"
            if (Test-Path $report) { Remove-Item -Force $report }
            $proc = Start-Process -FilePath $exe -ArgumentList @("--selftest", "`"$report`"") -Wait -PassThru -NoNewWindow
            if (-not (Test-Path $report)) { throw "Installed layout produced no self-test report (exit $($proc.ExitCode))" }
            $raw = Get-Content $report -Raw
            $json = $raw | ConvertFrom-Json
            Write-Host $raw
            $detail = $raw -replace "`r?`n", " "
            if ($detail.Length -gt 1200) { $detail = $detail.Substring(0, 1200) }

            if ($proc.ExitCode -ne 0 -or -not $json.ok) {
              Write-Output "::error::Installed layout self-test failed: $detail"
              throw "Installed layout self-test failed (exit $($proc.ExitCode))"
            }
            $expected = [System.IO.Path]::GetFullPath($app)
            $resolved = if ($json.runtime_lib) { [System.IO.Path]::GetFullPath($json.runtime_lib) } else { "" }
            Write-Host "Expected runtime/lib root: $expected"
            Write-Host "Runner reported          : $resolved"
            if (-not $resolved -or -not $resolved.StartsWith($expected, [System.StringComparison]::OrdinalIgnoreCase)) {
              Write-Output "::error::Runner resolved runtime/lib outside the install: '$resolved' vs '$expected' | $detail"
              throw "Runner resolved runtime/lib outside the install: '$resolved' vs '$expected'"
            }
            if (-not $json.libusb_backend) {
              Write-Output "::error::Installed layout lost the libusb backend: $detail"
              throw "Installed layout lost the libusb backend"
            }
            Write-Host "Installed layout OK: runtime/lib resolved to $($json.runtime_lib)" -ForegroundColor Green
          } catch {
            Write-Output "::error::Installed-layout check threw: $($_.Exception.Message)"
            throw
          }

      - name: Verify installer
        shell: pwsh
        run: |
          if (-not (Test-Path installer-bestmdmtool/frozen/BestMDMTool/BestMDMTool.exe)) {
            throw "Standalone BestMDMTool.exe was not built"
          }
          if (-not (Test-Path installer-bestmdmtool/frozen/BestMDMToolRunner/BestMDMToolRunner.exe)) {
            throw "BestMDMToolRunner.exe was not built"
          }
          foreach ($dll in @("libusb-1.0.dll", "libusb32-1.0.dll")) {
            if (-not (Test-Path "installer-bestmdmtool/frozen/BestMDMToolRunner/$dll")) {
              throw "$dll is missing next to BestMDMToolRunner.exe"
            }
          }
          $exe = Get-ChildItem -Path installer-bestmdmtool/artifacts/*.exe | Select-Object -First 1
          if (-not $exe) { throw "Installer .exe not found in installer-bestmdmtool/artifacts" }
          $hash = Get-FileHash -Path $exe.FullName -Algorithm SHA256
          Write-Host "Installer: $($exe.FullName)"
          Write-Host "Size bytes: $($exe.Length)"
          Write-Host "SHA256: $($hash.Hash)"
          if (-not (Test-Path installer-bestmdmtool/artifacts/SHA256SUMS.txt)) {
            throw "SHA256SUMS.txt was not generated"
          }
          @"
          ### BestMDMTool installer
          | Item | Value |
          | --- | --- |
          | File | $($exe.Name) |
          | Size | $([math]::Round($exe.Length / 1MB, 2)) MiB |
          | SHA256 | `$($hash.Hash)` |
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: BestMDMToolSetup
          path: installer-bestmdmtool/artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: BestMDMTool ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            BestMDMTool — Authorized Device Service (no login).

            Download `BestMDMToolSetup-*.exe` below, run it, and launch
            **BestMDMTool** from the Start Menu.

            Requirements: Windows 10/11. No Python install is needed — the GUI and
            the device backend are frozen bundles, and CI proves the backend can
            import mtkclient, load libusb and reach the DA loaders before publishing.

            Verify the download with `SHA256SUMS.txt`. The installer is unsigned, so
            SmartScreen shows *More info -> Run anyway* on first launch.

            Use only on devices you own or are explicitly authorized to service.
          files: |
            installer-bestmdmtool/artifacts/BestMDMToolSetup-*.exe
            installer-bestmdmtool/artifacts/SHA256SUMS.txt
