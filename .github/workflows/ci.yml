name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint new source
        run: >-
          ruff check app bestmdmtool servicecore tests
          installer/build_portable.py
          installer-bestmdmtool/build_portable.py

      - name: Byte-compile new source
        run: >-
          python -m compileall -q app bestmdmtool servicecore tests
          installer/build_portable.py
          installer-bestmdmtool/build_portable.py

      - name: Verify portable packaging
        run: |
          python installer/build_portable.py --output /tmp/oumse-portable
          python installer-bestmdmtool/build_portable.py --output /tmp/bestmdmtool-portable

      - name: Run unit tests
        run: |
          set +e
          python -m unittest discover -s tests -v 2>&1 | tee /tmp/tests.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo "Unit tests failed (exit $code); failure details follow."
            grep -E -A 12 "^(FAIL|ERROR): " /tmp/tests.log | head -n 80 | while IFS= read -r line; do
              echo "::error::$line"
            done
            tail -n 5 /tmp/tests.log | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit "$code"
