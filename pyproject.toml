[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "runtime",
    "legacy",
    "tcl",
    "tk",
    "tcl8",
    "customtkinter",
    "Bin",
    "adb_assets",
    "certifi",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app", "bestmdmtool", "servicecore"]
